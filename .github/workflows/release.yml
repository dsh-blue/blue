# R3 (release roadmap): tag-driven npm publish. CI-only publishing (D50):
# no release ever happens from a laptop — a vX.Y.Z-* tag on a master commit
# is the release authority, and the granular NPM_TOKEN is the only credential
# involved. The guard refuses tags that disagree with the manifest set (the
# same number version.spec lockstep-checks across the six manifests, read
# here without vitest so a mistyped tag dies in one second, not after the
# gates), and the full gate re-runs before publish so a tag can never ship
# what ci.yml wouldn't pass on the commit itself.
#
# Dist-tag is `rc` (D50): latest stays reserved for the stable line, so the
# documented install spec must carry the tag suffix (@dsh-blue/blue@rc).
# --provenance links each tarball to this build (public repo, pnpm ≥8.4);
# it needs the id-token permission below.
#
# Partial-failure note: pnpm -r publish walks topologically
# (core→interaction→transcript→app→bundle) and does NOT skip versions that
# already exist — if a run dies mid-sequence, the verify step shows what
# landed; rerun publishes only the missing tail by hand-editing this note's
# recovery: re-run with `pnpm --filter <missing-pkg> publish ...` semantics
# in a dispatch job, never by republishing the whole set.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance attestation

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  publish:
    name: gate + publish (dist-tag rc)
    runs-on: ubuntu-latest
    steps:
      # Full history: the master-ancestor guard below runs merge-base over
      # the fetched refs, and a depth-1 checkout carries neither remote
      # tracking refs nor the parent chain — the guard would false-fail
      # (or resolve wrongly) on the one commit it must never misjudge.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      # Tag ↔ manifest guard, before any install: the tag IS the release
      # version. version.spec holds the six-manifest lockstep; this reads
      # the number it guards (core's manifest) without dependencies, and
      # test:coverage below fails the run if the other five disagree.
      - name: guard (tag == manifest version, tag on master)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "release: tag v$TAG != manifest $MANIFEST — bump the six manifests + BLUE_VERSION, or fix the tag" >&2
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "release: tag commit is not on master — releases cut from master only" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The gate mirrors ci.yml exactly (fast checks first, lib/export
      # integrity before the test minute). The real-process smoke stays in
      # ci.yml: the tagged commit is a master commit that already passed it.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm diagrams:check
      - run: pnpm build
      - run: pnpm check:lib
      - run: pnpm test:coverage
      # Explicit .npmrc rather than NODE_AUTH_TOKEN: pnpm publish reads
      # npmrc config, and the written line is deterministic across pnpm
      # versions. The token is org-scoped granular (D50), never a classic.
      - name: npm auth (NPM_TOKEN granular)
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Topological order is pnpm's default; --no-git-checks because a tag
      # checkout is a detached HEAD (pnpm would otherwise refuse); website
      # is private:true and skipped naturally.
      - run: pnpm -r publish --tag rc --no-git-checks --provenance
      - name: verify (npm view, six packages)
        run: |
          V="${GITHUB_REF_NAME#v}"
          # A version can 404 on `npm view` for a few seconds after its
          # publish lands (registry read lag measured on the rc.2 run:
          # core verified instantly, interaction 404'd 2s after publish,
          # and all five were visible a minute later). Retry before
          # declaring the release broken.
          for p in blue-api blue-core blue-interaction blue-transcript blue-app blue; do
            ok=""
            for attempt in 1 2 3 4 5; do
              GOT=$(npm view "@dsh-blue/$p@$V" version 2>/dev/null || true)
              if [ "$GOT" = "$V" ]; then ok=1; break; fi
              echo "($p: not visible yet, attempt $attempt — retrying in 15s)"
              sleep 15
            done
            if [ -z "$ok" ]; then
              echo "::error::@dsh-blue/$p@$V not visible on npm after 5 attempts"
              exit 1
            fi
            echo "@dsh-blue/$p@$V → $GOT"
          done
      # Dist-tag hygiene (D50): npm ALWAYS writes `latest` on a package's
      # first publish, even with an explicit --tag — measured live on the
      # @dsh-blue/smoke canary (published --tag canary, latest still set).
      # Unedited, the first rc publish would squat latest=rc against the
      # "latest is the stable line" ruling. `npm dist-tag rm <pkg> latest`
      # is NOT a valid repair: the registry 403s deleting latest outright
      # (measured live on the rc.1 publish). latest can only be re-pointed
      # at an existing version, so: if a stable version exists, add latest
      # back onto the newest stable; if the rc line is all the package has
      # (first-publish window), latest is registry-locked to the rc and we
      # warn — it self-corrects when a stable release ships (--tag latest).
      - name: dist-tag hygiene (latest must not point at the rc line)
        run: |
          V="${GITHUB_REF_NAME#v}"
          for p in blue-api blue-core blue-interaction blue-transcript blue-app blue; do
            LATEST=$(npm view "@dsh-blue/$p" dist-tags.latest 2>/dev/null || true)
            if [ "$LATEST" = "$V" ]; then
              STABLE=$(npm view "@dsh-blue/$p" versions --json | jq -r '.[]?' | grep -v -- '-' | sort -V | tail -n 1)
              if [ -n "$STABLE" ]; then
                npm dist-tag add "@dsh-blue/$p@$STABLE" latest
                echo "re-pointed latest (= $V) back to stable $STABLE on @dsh-blue/$p"
              else
                echo "::warning::@dsh-blue/$p latest=$V with no stable version published yet; the registry requires a latest, so it stays on the rc line until a stable release re-points it"
              fi
            fi
          done

  # The GitHub Release page (promo: tag ↔ Release is 1:1 — no CHANGELOG.md
  # to keep in sync). Notes come from docs/release-notes/v<version>.md when
  # it ships with the tag (Highlights / Fixes / Known issues), falling back
  # to generated commit notes. Runs after publish so the page never
  # advertises a version that failed to land.
  release:
    name: GitHub release page
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: gh release create
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/v${V}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "Blue $V" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "Blue $V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
