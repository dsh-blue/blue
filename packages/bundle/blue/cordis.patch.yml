# The dsh-blue bundle patch: the Blue interactive terminal UI over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the optional task positional
# (`dsh --profile blue [task]` and `--resume <id>`) and this app's --help,
# then the app driver creates or resumes an Agent through the core registry
# and publishes it through `blueSession` for the transcript and interaction
# layers.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- insert:
    # --- Baseline segment -----------------------------------------------------
    # The plain baseline is this segment plus the assembly segment at the
    # bottom — eight rows total — and it is the complete, self-sufficient Blue
    # UI: the whole enhancement segment between them can be dropped and the
    # bundle still boots and works.

    # Blue core: the tree's only pi-tui adapter. Starts the terminal and
    # registers the blueScreen/blueKeymap/blueTerminalInfo/blueComponents
    # services.
    - id: blue-core
      name: '@dsh-blue/blue-core'

    # Blue theme (plain baseline segment): the built-in dark palette,
    # providing the blueTheme service as its own fiber.
    - id: blue-theme-dark
      name: '@dsh-blue/blue-core/theme-dark'

    # Welcome banner: the pixel-castle box rendered once at boot as the first
    # scroll-area child (model · provider from agentDefaultModel, cwd, tips).
    # Sits before blue-transcript on purpose: both fibers resolve in the same
    # blueComponents activation round, so the earlier row keeps the banner
    # first in the scroll area across initial mounts and /theme reloads.
    - id: blue-banner
      name: '@dsh-blue/blue-transcript/banner'

    # Transcript: renders session events (streamed Markdown, tool calls) onto
    # the blue screen. Also provides the blueStatus registry and mounts the
    # two-row footer shell bottom-pinned above the input editor.
    - id: blue-transcript
      name: '@dsh-blue/blue-transcript'

    # S33 dogfood verification — TEMPORARY, REMOVE BEFORE MERGE. Logs the
    # session/event firehose (with admission keys) and subagent/start|end
    # probes to /tmp/s33-dogfood.log. No screen child, no services.
    - id: blue-s33-debug
      name: '@dsh-blue/blue-transcript/s33-debug'

    # Baseline footer entry: the model name alone at priority 0, in the
    # full-strength text tier (the S15 kimi identity: the brightest thing in
    # the footer), registered into the transcript's blueStatus registry.
    - id: blue-status-basic
      name: '@dsh-blue/blue-transcript/status-basic'

    # --- Enhancement segment --------------------------------------------------
    # Optional layers over the plain baseline; the whole segment can be
    # dropped without breaking it. Bottom panes mount through
    # blueScreen.addBottomChild, so the dock's render order is the plugin
    # mount order — and the loader mounts sibling rows CONCURRENTLY, so raw
    # row order alone does not pin the dock. What orders it is the
    # blueComponents activation round: the transcript, activity, todo, and
    # btw plugins inject blueComponents, so their fibers activate when it
    # appears, in row order; the queue pane carries a row-level
    # `inject: [blueComponents]` pin to join the same round
    # (activity → queue → todo → btw), and the interaction row's input
    # plugin is created only inside interaction's apply, subscribing after
    # every row fiber, so the editor mounts last.
    # (Pinning on blueStatus instead would make the interaction fiber a
    # transitive blueTheme dependent and /theme would dispose its own
    # handler's fiber mid-swap.)

    # Editor plus: the '!' bash mode with shell echo, and slash-command /
    # '@'-file autocomplete, layered over the shared input editor through the
    # 'blue/input-editor-changed' event (so row order against blue-input does
    # not matter).
    - id: blue-editor-plus
      name: '@dsh-blue/blue-interaction/editor-plus'

    # Attachment store: the harness 'attachments' service (a filesystem
    # image store under $DSH_BLUE_ATTACHMENT_DIR / $DSH_HOME / ~/.dsh).
    # Mounts no screen child; row order is only pinned against paste-image,
    # which injects the service and therefore activates after this row.
    - id: blue-attachments
      name: '@dsh-blue/blue-interaction/attachments'

    # Image paste: the contextual Ctrl-V action that admits a clipboard
    # image through the attachment store, inserts its '[image #N]' marker
    # into the shared editor, and splits the markers into image content
    # blocks on submit. Injects 'attachments' (above), so it always mounts
    # after the store.
    - id: blue-paste-image
      name: '@dsh-blue/blue-interaction/paste-image'

    # Working-directory footer entry: the abbreviated session cwd (priority
    # 5, muted tier) — '~' under home, else the last three segments.
    - id: blue-status-cwd
      name: '@dsh-blue/blue-transcript/status-cwd'

    # Git footer entry: the full badge 'branch [+a -d ↑u↓v]' (priority 10,
    # muted tier) from a TTL-cached probe (branch 5s, status 15s, diff counts
    # only while dirty); renders nothing outside a git repository.
    - id: blue-status-git
      name: '@dsh-blue/blue-transcript/status-git'

    # Session-mode footer badge (S24a): 'plan' (accent, a queued entry
    # shows the pending ellipsis) or 'yolo' (warning) while either is in
    # force; normal renders nothing. Display-only fiber reading the yolo
    # WeakMap and the planMode controller — no commands, so the /theme
    # fiber-dispose trap does not apply.
    - id: blue-status-mode
      name: '@dsh-blue/blue-interaction/mode-status'

    # Rotating-teaching-tip footer entry: one tip, or two joined ' | ' when
    # the width allows (priority 30, the faintest textMuted tier,
    # right-aligned on the footer's first band), advancing every 10s.
    - id: blue-status-tips
      name: '@dsh-blue/blue-transcript/status-tips'

    # Context footer entry: the latest model step's context occupancy —
    # 'context: N% (used/window)' when the adapter advertises a window, else
    # the bare 'ctx N' (priority 20, text tier, right-aligned on the
    # footer's second band).
    - id: blue-status-context
      name: '@dsh-blue/blue-transcript/status-context'

    # Diff render intent: registers the 'diff' entry in the transcript's
    # blueIntents registry, so tool items whose presentCall/presentResult
    # views carry card:'diff' render as titled per-file unified diffs
    # instead of the generic tool card. Injects blueIntents (provided by
    # blue-transcript), so it always mounts after it; mounts no screen child.
    - id: blue-intent-diff
      name: '@dsh-blue/blue-transcript/intent-diff'

    # Terminal render intent: the same registry pattern for card:'terminal'
    # views — a '$ command' shell card with cwd, exit badge, and capped
    # output rows. Same blueIntents activation ordering as the diff row.
    - id: blue-intent-terminal
      name: '@dsh-blue/blue-transcript/intent-terminal'

    # Activity pane: the kimi mode machine over the attached session's event
    # stream — moon + teaching tip while waiting or running tools, braille
    # working… while composing, empty while thinking (the transcript's
    # thinking block owns the spinner), hidden while a dialog occupies the
    # editor slot, and a one-row idle placeholder once anything has run. It
    # injects blueComponents itself, joining the activation round that pins
    # its dock position.
    - id: blue-pane-activity
      name: '@dsh-blue/blue-transcript/pane-activity'

    # Queue pane: the attached agent's queued inbox messages, one row each,
    # plus the keyless action gating the empty-editor Up recall in blue-input.
    # Same blueComponents dock-order pin as the activity pane.
    - id: blue-pane-queue
      name: '@dsh-blue/blue-interaction/pane-queue'
      inject: [blueComponents]

    # Todo pane: the session's todo list (whole-list todo/write snapshots),
    # with the global Ctrl-T collapse toggle.
    - id: blue-pane-todo
      name: '@dsh-blue/blue-transcript/pane-todo'

    # Side-question pane and its /btw command: forks the live session into a
    # throwaway side agent and renders the exchange in the dock.
    - id: blue-pane-btw
      name: '@dsh-blue/blue-transcript/pane-btw'

    # Subagent pane (S33): the running subagent group pinned directly above
    # the editor (the last dock row before it), rendering the group card
    # over spawn-class calls the fold suppresses from the stream — the kimi
    # swarm-pane semantics. Injects blueComponents so its fiber joins the
    # same activation round as the other panes, keeping the dock order
    # (activity → queue → todo → btw → agents → editor) in row order.
    - id: blue-pane-agents
      name: '@dsh-blue/blue-transcript/pane-agents'
      inject: [blueComponents]

    # --- Assembly segment -------------------------------------------------------
    # The plain baseline's closing rows: the input editor with its built-in
    # commands and overlays, the startup provider, and the app driver.

    # Interaction: the input editor, built-in commands (/quit, /resume, /new,
    # /fork, /sessions, /help), the user-question provider, and the approval
    # answerer.
    - id: blue-interaction
      name: '@dsh-blue/blue-interaction'

    - id: blue-startup
      name: '@dsh-blue/blue-app/startup'

    # Reads its launch values from the ordinary blueStartup provider; the
    # plugin's own inject waits for the core Agent services and blueScreen.
    - id: blue-app
      name: '@dsh-blue/blue-app'
      inject: [blueStartup]
      config:
        task: !!js ctx.blueStartup.task
        resume: !!js ctx.blueStartup.resume
