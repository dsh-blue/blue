# Blue is an ordinary Cordis composition over dsh-base. Plugins inherit dsh
# services directly and opt into terminal UI through bluePanes, blueStatus,
# blueOverlays, and blueEditorExtensions.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

# Move the model-facing agent plane behind dsh agent presets, matching the
# upstream Web composition. Host registries and controllers remain ordinary
# root services shared by Blue and external Cordis plugins.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- id: session-title-llm
  disabled: true

- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        roots:
          - path: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-blue/blue/package.json')), 'presets')"
            trust: system
        includeShippedRoot: true
        includeUserRoot: true

    # Dynamic Cordis plugins enter the same service graph as official Blue
    # code. There is no private realm, service deny-list, or Blue host facade.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: session-title-all-prompts-llm
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    # Direct Blue UI services. Plugin lifetime is ordinary Cordis Fiber lifetime.
    - id: blue-api
      name: '@dsh-blue/blue-api'

    - id: blue-frontend
      name: '@dsh-blue/blue-frontend'

    - id: blue-core
      name: '@dsh-blue/blue-core'

    - id: blue-theme-dark
      name: '@dsh-blue/blue-core/theme-dark'

    - id: blue-conversation
      name: '@dsh-blue/blue-conversation'

    - id: blue-startup
      name: '@dsh-blue/blue-app/startup'

    - id: blue-app
      name: '@dsh-blue/blue-app'
      config:
        task: !!js ctx.blueStartup.task
        resume: !!js ctx.blueStartup.resume

    - id: blue-banner
      name: '@dsh-blue/blue-transcript/banner'

    - id: blue-transcript
      name: '@dsh-blue/blue-transcript'

    - id: blue-transcript-official
      name: '@dsh-blue/blue-transcript/official-model'

    - id: blue-status-basic
      name: '@dsh-blue/blue-transcript/status-basic-model'
    - id: blue-status-cwd
      name: '@dsh-blue/blue-transcript/status-cwd'
    - id: blue-status-git
      name: '@dsh-blue/blue-transcript/status-git'
    - id: blue-status-title
      name: '@dsh-blue/blue-transcript/status-title'
    - id: blue-status-context
      name: '@dsh-blue/blue-transcript/status-context'
    - id: blue-status-mode
      name: '@dsh-blue/blue-interaction/mode-status'
    - id: blue-status-jobs
      name: '@dsh-blue/blue-transcript/status-jobs'

    - id: blue-pane-activity
      name: '@dsh-blue/blue-transcript/pane-activity'
    - id: blue-pane-queue
      name: '@dsh-blue/blue-interaction/pane-queue'
    - id: blue-pane-todo
      name: '@dsh-blue/blue-transcript/pane-todo'
    - id: blue-pane-btw
      name: '@dsh-blue/blue-transcript/pane-btw'
    - id: blue-pane-agents
      name: '@dsh-blue/blue-transcript/pane-agents'
    - id: blue-pane-workflow
      name: '@dsh-blue/blue-transcript/pane-workflow'

    - id: blue-attachments
      name: '@dsh-blue/blue-interaction/attachments'
    - id: blue-paste-image
      name: '@dsh-blue/blue-interaction/paste-image'
      config:
        backend: auto
    - id: blue-editor-plus
      name: '@dsh-blue/blue-interaction/editor-plus'

    - id: blue-jobs
      name: '@dsh-blue/blue-interaction/jobs'
    - id: blue-agents-command
      name: '@dsh-blue/blue-interaction/agents-command'

    - id: blue-interaction
      name: '@dsh-blue/blue-interaction'
